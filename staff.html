<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord · Commandes IFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="loading">
  <header class="topbar"></header>

  <main>
    <h1>Toutes les commandes</h1>

    <div class="toolbar">
      <input type="search" id="search" class="search" placeholder="Rechercher (titre, demandeur, e-mail)...">

      <!-- Filtre multiple sur les statuts : un <details> contenant des cases à cocher -->
      <details class="multi-select" id="status-filter">
        <summary>Statut</summary>
        <div class="options"></div>
      </details>

      <select id="sort">
        <option value="createdAt">Tri : date de création</option>
        <option value="updatedAt">Tri : dernière mise à jour</option>
      </select>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Statut</th>
            <th>Titre</th>
            <th>Demandeur</th>
            <th class="num">Total indicatif</th>
            <th>Dernière mise à jour</th>
            <th>Création</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="orders">
          <tr><td colspan="7" class="empty">Chargement...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer"></footer>

  <script type="module" src="js/pages/staff.js"></script>
</body>
</html>
